<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ title }}</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <main class="shell">
    <section class="intro">
      <div>
        <p class="eyebrow">Perceptron ML Model</p>
        <h1>Upload a handwritten digit</h1>
        <p class="subtitle">The backend uses your saved perceptron model to classify PNG images as either 0 or 1.</p>
      </div>
      <div id="status" class="status">Checking model...</div>
    </section>

    <section class="workspace">
      <form id="uploadForm" class="upload-panel">
        <label id="dropZone" class="drop-zone" for="imageInput">
          <input id="imageInput" name="file" type="file" accept="image/png" required />
          <span class="drop-icon">PNG</span>
          <span class="drop-title">Choose or drop a digit image</span>
          <span class="drop-copy">Use a clear 0 or 1 drawing on a plain background.</span>
        </label>

        <div class="actions">
          <button id="predictBtn" type="submit">Predict Digit</button>
          <button id="clearBtn" class="secondary" type="button">Clear</button>
        </div>
      </form>

      <aside class="preview-panel">
        <div class="preview-frame">
          <img id="preview" alt="Uploaded digit preview" />
          <div id="placeholder" class="placeholder">Preview</div>
        </div>
        <div id="result" class="result">
          <span class="result-label">Prediction</span>
          <strong>-</strong>
        </div>
      </aside>
    </section>
  </main>

  <script>
    const form = document.getElementById('uploadForm');
    const imageInput = document.getElementById('imageInput');
    const dropZone = document.getElementById('dropZone');
    const preview = document.getElementById('preview');
    const placeholder = document.getElementById('placeholder');
    const result = document.getElementById('result');
    const statusBox = document.getElementById('status');
    const predictBtn = document.getElementById('predictBtn');
    const clearBtn = document.getElementById('clearBtn');

    function setResult(label, detail) {
      result.innerHTML = `<span class="result-label">${label}</span><strong>${detail}</strong>`;
    }

    async function checkStatus() {
      const response = await fetch('/api/status');
      const data = await response.json();
      if (data.ready) {
        statusBox.textContent = 'Model ready';
        statusBox.className = 'status ready';
        predictBtn.disabled = false;
        return;
      }
      statusBox.textContent = data.error ? 'Model unavailable' : 'Model loading';
      statusBox.className = 'status error';
      predictBtn.disabled = true;
    }

    function showPreview(file) {
      if (!file) {
        preview.removeAttribute('src');
        preview.classList.remove('visible');
        placeholder.classList.remove('hidden');
        return;
      }
      const url = URL.createObjectURL(file);
      preview.src = url;
      preview.onload = () => URL.revokeObjectURL(url);
      preview.classList.add('visible');
      placeholder.classList.add('hidden');
      setResult('Prediction', '-');
    }

    imageInput.addEventListener('change', () => showPreview(imageInput.files[0]));

    ['dragenter', 'dragover'].forEach((eventName) => {
      dropZone.addEventListener(eventName, (event) => {
        event.preventDefault();
        dropZone.classList.add('dragging');
      });
    });

    ['dragleave', 'drop'].forEach((eventName) => {
      dropZone.addEventListener(eventName, (event) => {
        event.preventDefault();
        dropZone.classList.remove('dragging');
      });
    });

    dropZone.addEventListener('drop', (event) => {
      const file = event.dataTransfer.files[0];
      if (!file) return;
      imageInput.files = event.dataTransfer.files;
      showPreview(file);
    });

    clearBtn.addEventListener('click', () => {
      form.reset();
      showPreview(null);
      setResult('Prediction', '-');
    });

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const file = imageInput.files[0];
      if (!file) {
        setResult('Upload needed', 'PNG');
        return;
      }
      if (file.type !== 'image/png') {
        setResult('Invalid file', 'PNG only');
        return;
      }

      predictBtn.disabled = true;
      setResult('Predicting', '...');

      const formData = new FormData();
      formData.append('file', file);

      const response = await fetch('/api/predict', {
        method: 'POST',
        body: formData,
      });
      const data = await response.json();
      predictBtn.disabled = false;

      if (!response.ok) {
        setResult('Error', data.detail || 'Failed');
        return;
      }

      const confidence = data.confidence ? ` (${Math.round(data.confidence * 100)}%)` : '';
      setResult('Prediction', `${data.label}${confidence}`);
    });

    checkStatus();
  </script>
</body>
</html>
